<!DOCTYPE html>
<html>
<head>
    <title>My Search Engine</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #fff;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            margin: 50px 0 30px 0;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            color: #4285f4;
            margin-bottom: 20px;
        }
        
        .search-form {
            margin-bottom: 30px;
        }
        
        .search-box {
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            transition: box-shadow 0.2s;
        }
        
        .search-box:focus {
            border-color: #4285f4;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
        }
        
        .search-button {
            margin-top: 20px;
            padding: 10px 30px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .search-button:hover {
            background: #357ae8;
        }
        
        .stats {
            color: #70757a;
            margin: 20px 0;
            font-size: 14px;
        }
        
        .result {
            margin: 25px 0;
            padding: 15px;
            border-left: 3px solid #4285f4;
            background: #f8f9fa;
            border-radius: 4px;
        }
        
        .result-title {
            font-size: 20px;
            color: #1a0dab;
            margin-bottom: 5px;
            font-weight: normal;
        }
        
        .result-title:hover {
            text-decoration: underline;
        }
        
        .result-url {
            color: #006621;
            font-size: 14px;
            margin-bottom: 10px;
            word-break: break-all;
        }
        
        .result-snippet {
            color: #545454;
            line-height: 1.6;
            font-size: 14px;
        }
        
        .no-results {
            text-align: center;
            color: #70757a;
            margin-top: 50px;
            font-size: 16px;
        }
        
        @media (max-width: 600px) {
            .logo {
                font-size: 36px;
            }
            
            .result-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔍 MySearch</div>
        </div>
        
        <form method="POST" class="search-form">
            <input type="text" 
                   name="query" 
                   class="search-box" 
                   placeholder="Search the web..." 
                   value="{{ query }}" 
                   autofocus>
            <center>
                <button type="submit" class="search-button">Search</button>
            </center>
        </form>
        
        {% if results %}
            <div class="stats">Found {{ results|length }} results</div>
            {% for result in results %}
            <div class="result">
                <div class="result-title">{{ result.title or 'Untitled' }}</div>
                <div class="result-url">{{ result.url }}</div>
                <div class="result-snippet">{{ result.snippet }}</div>
            </div>
            {% endfor %}
        {% elif query %}
            <div class="no-results">
                No results found for "{{ query }}"
            </div>
        {% endif %}
    </div>
</body>
</html>
